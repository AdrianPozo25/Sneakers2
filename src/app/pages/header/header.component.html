<header class="header lobster-regular">
  <!-- Logo -->
  <div class="header__logo">
<a routerLink="/" routerLinkActive="active">
  <img src="image/logo.png" alt="Logo Sneakers" class="logo-img" />
</a>
  </div>

  <!-- Navegación -->
  <nav class="header__nav">
    <ul class="header__menu">
      <li><a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Inicio</a></li>
      <li><a routerLink="/catalogo" routerLinkActive="active">Catálogo</a></li>
      <li><a routerLink="/contacta" routerLinkActive="active">Contacto</a></li>
    </ul>

    <!-- Separador -->
    <div class="header__divider"></div>

    <!-- Cesta -->
    <div class="header__cesta">
      <a routerLink="/cesta" routerLinkActive="active">
        <span>Cesta</span>
        <img class="imagen_cesta" src="image/cesta.png" alt="Icono de la cesta">
      </a>
    </div>

    <!-- Auth (login/registro) -->
    <div class="header__auth">
      <ng-container *ngIf="!isLoggedIn; else userLogged">
        <a routerLink="/login" routerLinkActive="active" class="auth-link">Iniciar sesión</a>
        <a routerLink="/register" routerLinkActive="active" class="auth-link">Registrarse</a>
      </ng-container>
    
      <ng-template #userLogged>
        <div class="header__user-box" (click)="toggleMenu()" tabindex="0" (blur)="closeMenu()">
          <div class="header__user-avatar">{{ username.charAt(0) | uppercase }}</div>
          <span class="header__user-name">{{ username }}</span>
          
          <div class="header__dropdown" *ngIf="menuOpen">
            <a routerLink="/mi-cuenta">👤 Mi cuenta</a>
            <a routerLink="/lanzamientos">🔥 Nuevos lanzamientos</a>
            <button (click)="logout()">🚪 Cerrar sesión</button>
          </div>
        </div>
        
      </ng-template>
      
    </div>
    
  </nav>
</header>
