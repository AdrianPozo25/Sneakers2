<div class="product-container">
  <!-- Contenedor de la imagen y la info -->
  <div class="product-details">

    <!-- Carrusel de las fotos -->
    <div class="carousel-container">
      <button class="carousel-btn left" (click)="cambiarImagen(-1)">&#10094;</button>
      <div class="image-wrapper">
        <img [src]="producto.imagenes[imagenActualIndex]" [alt]="producto.nombre">
      </div>
      <button class="carousel-btn right" (click)="cambiarImagen(1)">&#10095;</button>
      <div class="carousel-indicators">
        <span *ngFor="let img of producto.imagenes; let i = index"
              class="indicator"
              [class.active]="i === imagenActualIndex"
              (click)="seleccionarImagen(i)">
        </span>
      </div>
    </div>

    <!-- Información del producto -->
    <div class="product-info">
      <h2>{{ producto.nombre }}</h2>
      <p class="price">{{ producto.precio }}€</p>

      <!-- Selector de talla -->
      <div class="selector-container">
        <label><strong>Talla:</strong></label>
        <div class="chip-group">
          <button 
            *ngFor="let talla of producto.tallas" 
            class="chip" 
            [class.selected]="talla === tallaSeleccionada"
            (click)="tallaSeleccionada = talla">
            {{ talla }}
          </button>
        </div>
      </div>

      <!-- Selector de color -->
      <div class="selector-container">
        <label><strong>Color:</strong></label>
        <div class="chip-group">
          <button 
            *ngFor="let color of producto.colores" 
            class="chip" 
            [class.selected]="color === colorSeleccionado"
            (click)="colorSeleccionado = color">
            {{ color }}
          </button>
        </div>
      </div>

      <!-- Botón de añadir a la cesta -->
      <button class="add-to-cart" (click)="agregarACesta()">Añadir a la cesta</button>
    </div>
  </div> <!-- ← Cierre correcto de .product-details -->

  <!-- Descripción del producto (fuera de .product-details) -->
  <div class="product-description">
    <h3>Descripción</h3>
    <p>{{ producto.descripcion }}</p>
  </div>
</div>
